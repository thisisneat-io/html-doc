Views:
- View: CogniteDescribable
  Description: 'The describable core concept is used as a standard way of holding
    the bare minimum of information about the instance

    '
- View: CogniteSourceable
- View: CogniteSourceSystem
  Description: The CogniteSourceSystem core concept is used to standardize the way
    source system is stored.
  Implements: CogniteDescribable
- View: CogniteSchedulable
  Description: CogniteSchedulable represents the metadata about when an activity (or
    similar) starts and ends.
- View: CogniteVisualizable
  Description: CogniteVisualizable defines the standard way to reference a related
    3D resource
- View: Cognite3DTransformation
  Description: 'The Cognite3DTransformation object defines a comprehensive 3D transformation,
    enabling precise adjustments to an object''s position, orientation, and size in
    the 3D coordinate system. It allows for the translation of objects along the three
    spatial axes, rotation around these axes using Euler angles, and scaling along
    each axis to modify the object''s dimensions. The object''s transformation is
    defined in "CDF space", a coordinate system where the positive Z axis is the up
    direction

    '
- View: CogniteCubeMap
  Description: 'The cube map holds references to 6 images in used to visually represent
    the surrounding environment

    '
- View: Cognite3DObject
  Description: This is the virtual position representation of an object in the physical
    world, connecting an asset to one or more 3D resources
  Implements: CogniteDescribable
- View: Cognite3DModel
  Description: Groups revisions of 3D data of various kinds together (CAD, PointCloud,
    Image360)
  Implements: CogniteDescribable
- View: CogniteCADModel
  Description: Navigational aid for traversing CogniteCADModel instances
  Implements: CogniteDescribable,Cognite3DModel
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DModel","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"CAD"}}]})
- View: Cognite3DRevision
  Description: 'Shared revision information for various 3D data types. Normally not
    used directly, but through CognitePointCloudRevision, Image360Collection or CogniteCADRevision

    '
- View: CognitePointCloudModel
  Description: Navigational aid for traversing CognitePointCloudModel instances
  Implements: CogniteDescribable,Cognite3DModel
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DModel","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"PointCloud"}}]})
- View: Cognite360ImageModel
  Description: Navigational aid for traversing Cognite360ImageModel instances
  Implements: CogniteDescribable,Cognite3DModel
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DModel","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"Image360"}}]})
- View: CogniteCADRevision
  Description: ''
  Implements: Cognite3DRevision
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DRevision","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"CAD"}}]})
- View: CognitePointCloudRevision
  Description: Navigational aid for traversing CognitePointCloudRevision instances
  Implements: Cognite3DRevision
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DRevision","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"PointCloud"}}]})
- View: Cognite360ImageCollection
  Description: Represents a logical collection of Cognite360Image instances
  Implements: CogniteDescribable,Cognite3DRevision
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DRevision","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DModel","type"],"value":"Image360"}}]})
- View: CogniteCADNode
  Description: Represents nodes from the 3D model that have been contextualized
  Implements: CogniteDescribable
- View: CognitePointCloudVolume
  Description: PointCloud volume definition
  Implements: CogniteDescribable
- View: Cognite360Image
  Description: ''
  Implements: Cognite3DTransformation,CogniteCubeMap
- View: Cognite360ImageStation
  Description: A way to group images across collections. Used for creating visual
    scan history
  Implements: CogniteDescribable
  Filter: rawFilter({"and":[{"hasData":[{"space":"cdf_cdm_3d","externalId":"Cognite3DGroup","type":"container"}]},{"equals":{"property":["cdf_cdm_3d","Cognite3DGroup","groupType"],"value":"Station360"}}]})
- View: Cognite360ImageAnnotation
  Description: ''
  Implements: CogniteDescribable,CogniteSourceable,CogniteAnnotation
- View: CogniteAsset
  Name: Asset
  Description: Assets represent systems that support industrial functions or processes.
    Assets are often called 'functional location'.
  Implements: CogniteVisualizable,CogniteDescribable,CogniteSourceable
- View: CogniteAssetClass
  Name: Asset class
  Description: Represents the class of an asset.
  Implements: CogniteDescribable
- View: CogniteAssetType
  Name: Asset type
  Description: Represents the type of an asset.
  Implements: CogniteDescribable
- View: CogniteEquipment
  Name: Equipment
  Description: Equipment represents physical supplies or devices.
  Implements: CogniteDescribable,CogniteSourceable
- View: CogniteEquipmentType
  Name: Equipment type
  Description: Represents the type of equipment.
  Implements: CogniteDescribable
- View: CogniteFile
  Name: File
  Description: Represents files.
  Implements: CogniteDescribable,CogniteSourceable
- View: CogniteFileCategory
  Name: File category
  Description: Represents the categories of files as determined by contextualization
    or categorization.
  Implements: CogniteDescribable
- View: CogniteActivity
  Name: Activity
  Description: Represents activities. Activities typically happen over a period and
    have a start and end time.
  Implements: CogniteDescribable,CogniteSourceable,CogniteSchedulable
- View: CogniteTimeSeries
  Name: Time series
  Description: Represents a series of data points in time order.
  Implements: CogniteDescribable,CogniteSourceable
- View: CogniteAnnotation
  Description: Annotation represents contextualization results or links
  Implements: CogniteDescribable,CogniteSourceable
- View: CogniteDiagramAnnotation
  Description: Annotation for diagrams
  Implements: CogniteDescribable,CogniteSourceable,CogniteAnnotation
- View: CogniteUnit
  Description: Represents a single unit of measurement
  Implements: CogniteDescribable
