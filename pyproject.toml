[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neat-html-doc"
version = "0.2.0"
description = "NEAT write plugin: interactive HTML docs from a data model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cognite-neat>=0.123.4", "openpyxl>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["html_doc*"]

[tool.setuptools.package-data]
html_doc = ["*.yaml", "generate_documentation_v9.py"]

[project.entry-points."cognite.neat.plugin.data_model.file_writers"]
html_doc = "html_doc.plugin:HtmlDocPlugin"

